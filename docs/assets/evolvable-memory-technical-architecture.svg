<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
<title id="title">Memory: evidence, revisions, recall and attributable outcomes</title>
<desc id="desc">Five mechanisms connect input evidence to immutable revisions, time-bounded recall traces, attributed outcomes and bounded policy updates. PostgreSQL is authoritative; Milvus is rebuildable. Outcome and strategy operations are explicit, separate feedback steps.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#226852" stroke-width="1.8"/></marker>
