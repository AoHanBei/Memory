<text x="78" y="637" class="label">POSTGRESQL / AUTHORITATIVE STATE</text>
<text x="80" y="697" class="body">Evidence · Revisions · Traces · Outcomes · Strategies</text>
<text x="80" y="741" class="body">Write transaction → outbox → leased projection worker</text>
<text x="80" y="784" class="small">Append-only records + Scope checks + audit boundaries</text>
<text x="80" y="824" class="small">Worker: retry · dead letter · cursor · rebuild · deletion fence</text>
<rect x="968" y="602" width="576" height="250" rx="5" fill="#fff" stroke="#ccd9cf" stroke-width="1.5"/>
<rect x="968" y="602" width="576" height="51" fill="#e6eee4"/>
<text x="990" y="637" class="label">MILVUS / REBUILDABLE PROJECTION</text>
<text x="990" y="697" class="body">Hashed Scope + revision IDs + vectors</text>
<text x="990" y="741" class="body">Candidates rechecked against authority</text>
<text x="990" y="784" class="small">Default: deterministic hash embedding, 384D</text>
<text x="990" y="824" class="small">Degrade to lexical recall when permitted</text>
