<text x="678" y="254" class="label">03 / RECALL</text>
<text x="678" y="300" class="h">Freeze a Trace</text>
<text x="678" y="352" class="small">Time-bounded visibility</text>
<text x="678" y="390" class="small">Score + policy snapshot</text>
<text x="678" y="428" class="small">Belief / utility unchanged</text>
<text x="678" y="478" class="mono">Trace is appended</text>
